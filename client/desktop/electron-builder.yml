# MantleOS Desktop packaging (the Jackdaw desktop app until the 2026-10-17
# one-brand rename; appId, productName, the update feed and the Linux binary
# name still say jackdaw on purpose, see client/desktop/README.md). Built by
# `pnpm dist` locally (no publish) and the desktop.yml workflow on tag push (publishes to a DRAFT GitHub release —
# publishing stays a human act, same as the image pipeline's deploy step).
appId: engineering.crossworks.jackdaw
productName: Jackdaw
directories:
  buildResources: build
  output: dist

# out/ = the electron-vite bundles; ui/ = the standalone next build of
# client/web (staged by build-ui.sh). ui/ and resources/ stay OUTSIDE the
# asar: the UI runs as a utilityProcess, which needs real files on disk, and
# the icon path feeds Tray/Notification.
files:
  - out/**
  - resources/**
  - ui/**
  - package.json
asarUnpack:
  - ui/**
  - resources/**

# electron-updater reads GitHub releases; the repo is public so no token is
# needed at runtime. This must name the repo the desktop app is RELEASED from —
# jackdaw since the 2026-08-13 split. While it still said `mantle`, a packaged
# build checked a repo that no longer tags desktop builds.
publish:
  provider: github
  owner: crossworks-engineering
  repo: jackdaw

# Deliberately still `mantle://`, not `jackdaw://`. The scheme addresses MANTLE
# content (mantle://n/<id> is the permalink responders embed), not this app —
# renaming it would break every link already written into a brain's history.
protocols:
  - name: Mantle
    schemes: [mantle]

npmRebuild: false

linux:
  # The workspace package name is scoped (@mantle/client-desktop) — invalid in
  # file paths, so name the binary explicitly.
  executableName: jackdaw
  artifactName: jackdaw-${version}-${arch}.${ext}
  target: [AppImage, deb]
  category: Office
  icon: build/icon.png
  synopsis: MantleOS Desktop, the desktop client for your MantleOS brain
mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  # Signing has TWO modes, picked by desktop.yml from which secrets exist:
  #
  # - Developer ID (CSC_LINK secret set): this section as written. Hardened
  #   runtime + entitlements, then notarized with the App Store Connect API key
  #   (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER) and stapled by
  #   @electron/notarize. Opens with no warning; electron-updater can apply
  #   updates.
  # - Ad-hoc (no certificate): CI overrides identity to "-" and turns the
  #   hardened runtime and notarization off. macOS then says it cannot verify
  #   the developer (Privacy & Security > Open Anyway) instead of "damaged".
  #
  # Never ship with NO signing step. That is what v0.6.251 and earlier did:
  # the bundle kept Electron's linker-signed stub ("code has no resources but
  # signature indicates they must be present"), and a quarantined download of
  # that seal is reported by Gatekeeper as damaged, with no Open Anyway.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
win:
  target: [nsis]
