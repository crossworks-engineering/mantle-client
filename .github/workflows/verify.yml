# The gate. Runs `pnpm verify` (typecheck, lint, format, unit tests) — the same
# command the pre-push hook runs, so CI and a local push agree by construction.
#
# Why it exists: until 2026-09 the only two workflows here fired on `v*` tags,
# which meant nothing checked ordinary work. The pre-push hook
# (scripts/git-hooks/pre-push) covers it, but only in clones that opted in with
# `git config core.hooksPath scripts/git-hooks` — a gate you can forget to
# install is not a gate. This one cannot be skipped by forgetting.
#
# Triggers follow how this repo actually lands work: branches are merged to main
# LOCALLY (scripts/merge-branch.sh) and main is pushed, so `push: main` is the
# check that matters. `demo` is covered because main merges into it. Pull
# requests are covered too, for when work does arrive that way — a PR from a
# branch in this repo runs once, not twice, because feature-branch pushes are
# not themselves a trigger.
#
# The workspace specs are a job of their own below (e2e-workspace): they bring
# their own mock API, so they need nothing configured and always run.
#
# Playwright is a SECOND job below, deliberately conditional. The suite needs a
# live brain, and this repo cannot start one — the server workspace left in the
# split. So the job runs only where a brain has been configured, and is inert
# everywhere else rather than failing red on every push and teaching people to
# ignore it.

name: verify

on:
  push:
    branches: [main, demo]
  pull_request:
  workflow_dispatch:

# One run per ref. A second push while the first is still going supersedes it
# rather than queueing behind it; main is never cancelled, so every landed
# commit keeps a result of its own.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Locally the whole gate is ~35 s. Ten minutes is loose enough for a cold
    # store on a slow runner and tight enough that a hang is not billed as one.
    timeout-minutes: 10
    steps:
      # Current majors. All three workflows are on this line now — the other
      # two caught up in their own commit; see the note there about what is and
      # is not testable without cutting a tag.
      - uses: actions/checkout@v7

      # No `version:` here on purpose — the action reads packageManager from
      # package.json ("pnpm@11.1.2"), already the one place this repo states its
      # pnpm version. Passing it twice is a second place to drift. It must also
      # stay AHEAD of setup-node, which needs pnpm on PATH to find the store.
      - uses: pnpm/action-setup@v6

      # setup-node v7 narrowed AUTOMATIC cache detection to npm; `cache: pnpm`
      # is the explicit input and is unaffected.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # --frozen-lockfile is half the value of this job: it fails when
      # pnpm-lock.yaml disagrees with any package.json, which is exactly the
      # drift a local install would paper over.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck (all four workspaces) → lint → format:check → vitest.
      # Deliberately the script, not its four parts: whatever `pnpm verify`
      # grows to mean stays what CI enforces.
      - name: Verify
        run: pnpm verify

  # The workspace specs (e2e/workspace): the one shell for every login against
  # an in-memory brain the specs start themselves, so NO brain, no database
  # and no secrets. Its own job, not a step of `e2e`: that job's owner UI
  # already holds a `next dev` on client/web, and Next allows one per directory.
  e2e-workspace:
    runs-on: ubuntu-24.04
    # ~15 s of specs locally, plus the first `next dev` compile of each route.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright's bundled Chromium, like the e2e job (no E2E_BROWSER_CHANNEL).
      - name: Install Playwright Chromium
        run: pnpm -C e2e exec playwright install --with-deps chromium

      - name: e2e (workspace, mock API)
        run: pnpm e2e:workspace

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-workspace-traces
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The suite runs against a brain THIS JOB BUILDS, fresh, per run.
  #
  # It used to wait on an `E2E_SERVER_URL` repository variable naming a brain
  # somewhere. That variable was never set, so this job had never once run —
  # and it could not safely BE set: the suite creates and deletes content, and
  # every box in the fleet is real (the one called `mantle-test` has served
  # Astron since 2026-07-29). A brain that is built here and dies with the
  # runner cannot wipe anything that matters, costs nothing, and is the same
  # shape as the hermetic stack the repo split removed.
  #
  # `E2E_SERVER_URL` still wins if it is set, so pointing a run at a real brain
  # stays one variable away — but nothing has to be set for this to run.
  #
  # mantle-client is the CLIENT: no server workspace, no database, so it cannot boot a
  # brain from its own source. It boots the PUBLISHED server image instead, the
  # same one the fleet runs, which is also why this job needs no mantle checkout.
  #
  # Deliberately not `needs: verify`: a red lint and a red e2e are independent
  # facts, and serialising them only makes the second one arrive later.
  e2e:
    runs-on: ubuntu-24.04
    # The suite is one worker, no parallelism (specs share one brain and would
    # race each other's fixtures), plus a few minutes to build the brain.
    timeout-minutes: 30

    # Postgres must be the pgvector image: the schema has vector columns and
    # plain postgres fails the migration with an error that does not mention
    # extensions. Health-gated so the init step cannot run against a socket
    # that is not listening yet.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20


    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only: every spec here drives the owner UI, and the two engines
      # we do not assert on would double the install for nothing.
      - name: Install Playwright Chromium
        run: pnpm -C e2e exec playwright install --with-deps chromium

      # ── Build the brain ────────────────────────────────────────────────
      # The published server image is the same one the fleet runs, so this
      # tests the client against a real brain without needing a mantle
      # checkout. `latest` tracks the newest published server.
      - name: Pull the server image
        if: vars.E2E_SERVER_URL == ''
        run: docker pull titanwest/mantle-server:${{ vars.E2E_SERVER_IMAGE_TAG || 'latest' }}

      # The browser sidecar is NOT a service container. Two specs make the brain spawn a browser (the PDF
      # export and the draw snapshot re-render), and the sidecar then fetches a
      # URL BACK from the brain. A service container sits on the bridge network,
      # where `localhost` is its own container — so the brain, which runs on the
      # HOST network, is unreachable and the render dies with
      # ERR_CONNECTION_REFUSED naming a URL that is perfectly correct from the
      # brain's side. Everything that has to talk to the brain runs on the host
      # network, so one `localhost` means the same thing to all of them.
      - name: Start the browser sidecar
        if: vars.E2E_SERVER_URL == ''
        run: |
          docker run -d --name e2e-browser --network host \
            -e TOKEN=mantle ghcr.io/browserless/chromium:v2.55.0
          for i in $(seq 1 40); do
            curl -sf -o /dev/null "http://localhost:3000/?token=mantle" && break
            sleep 2
          done

      # RustFS, the store mantle's own compose runs (v0.232.249+), from our
      # digest-pinned mirror of rustfs/rustfs (mantle infra/rustfs/IMAGE). It was
      # MinIO until MinIO left open source: its public images went, quay.io
      # started denying the anonymous pull, and this job failed on every release
      # from v0.6.131. A mirror we publish cannot vanish that way.
      #
      # Started by hand on the host network, like the browser sidecar, so the
      # brain reaches it as localhost and a failed start can print its own log.
      # No volume: the image makes /data and hands it to UID 10001 (the user
      # RustFS runs as), and the anonymous volume docker creates keeps that
      # owner. A bind mount would need a chown first, as mantle's
      # objectstore_init does. The console is off (it would take :9001), logs go
      # to stdout so `docker logs` shows them, and the nofile limit is the one
      # mantle's compose sets (RustFS drops its file-descriptor cache below it).
      - name: Start the object store
        if: vars.E2E_SERVER_URL == ''
        run: |
          docker run -d --name e2e-objectstore --network host \
            --ulimit nofile=65536:65536 \
            -e RUSTFS_ACCESS_KEY=e2e-access -e RUSTFS_SECRET_KEY=e2e-secret-key \
            -e RUSTFS_CONSOLE_ENABLE=false -e RUSTFS_REGION=us-east-1 \
            -e RUSTFS_OBS_LOG_DIRECTORY= \
            titanwest/mantle-rustfs:1.0.0
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:9000/health/ready && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:9000/health/ready \
            || { docker logs e2e-objectstore; exit 1; }

      # The postgres image runs /docker-entrypoint-initdb.d/*.sql once, at first
      # cluster init, for the DEFAULT database only — and those files live in the
      # mantle repo, not here, so a service container never applies them. Without
      # them the migrations fail on a missing `vector` extension and a missing
      # `auth.users`, with an error that names neither.
      #
      # Taken from the IMAGE rather than copied into this file: the image already
      # carries them, so they match the server being tested and cannot drift from
      # it. A hand-copied version of this SQL was wrong in three ways on the first
      # attempt (invented an extension, missed `ltree`, and renamed a column),
      # none of which this can be.
      - name: Initialise the database (extensions + auth schema)
        if: vars.E2E_SERVER_URL == ''
        env:
          PGPASSWORD: e2e
        run: |
          docker run --rm titanwest/mantle-server:${{ vars.E2E_SERVER_IMAGE_TAG || 'latest' }} \
            sh -c 'cat /app/infra/postgres/init/*.sql' \
            | psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1

      # Secrets the brain refuses to boot without. MANTLE_MASTER_KEY must decode
      # to EXACTLY 32 bytes — an arbitrary string boots fine and then fails the
      # first write with "must decode to 32 bytes", which surfaces as a 500 from
      # /api/onboarding during e2e bootstrap and looks like a broken app.
      # Generated per run: nothing here outlives the runner.
      - name: Generate brain secrets
        if: vars.E2E_SERVER_URL == ''
        run: |
          MK="$(openssl rand -base64 32)"
          SS="$(openssl rand -hex 32)"
          # Mask BEFORE exporting: anything put in $GITHUB_ENV is an ordinary
          # variable and is echoed in every later step's env group, so without
          # this the brain's keys sit in the log in plain text. They are
          # throwaway and per-run, but a log is a log.
          echo "::add-mask::$MK"
          echo "::add-mask::$SS"
          echo "MANTLE_MASTER_KEY=$MK" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=$SS" >> "$GITHUB_ENV"

      # Migrations, the pg-boss schema, the DBOS system database and the bucket:
      # the same one-shot command mantle's own compose `migrate` service runs.
      # `objectstore:ensure` creates S3_BUCKET with plain S3 calls (it replaced
      # MinIO's `mc`), and waits for the store to answer first. It is in the
      # server image from v0.232.245, so E2E_SERVER_IMAGE_TAG must not pin older.
      - name: Migrate the brain
        if: vars.E2E_SERVER_URL == ''
        run: |
          docker run --rm --network host \
            -e DATABASE_URL='postgres://postgres:e2e@localhost:5432/postgres' \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e MANTLE_MASTER_KEY="$MANTLE_MASTER_KEY" \
            -e S3_ENDPOINT='http://localhost:9000' -e S3_REGION=us-east-1 \
            -e S3_BUCKET=mantle -e S3_ACCESS_KEY=e2e-access -e S3_SECRET_KEY=e2e-secret-key \
            -e S3_FORCE_PATH_STYLE=true -e NODE_ENV=production \
            titanwest/mantle-server:${{ vars.E2E_SERVER_IMAGE_TAG || 'latest' }} \
            sh -c "pnpm -C packages/db migrate && pnpm -C server/web pgboss:init && pnpm -C server/api provision && pnpm -C packages/storage objectstore:ensure"

      # MANTLE_SPACES_ROOT: a production brain refuses personal-space file
      # writes without it (503, so the bytes never land in the container
      # layer). The runner dies with the brain, so a path inside the container
      # is durable enough.
      #
      # CORS is not optional: MANTLE_API_CORS_ORIGINS must name the client origin
      # or every browser spec fails on CORS while the API-only ones pass — a
      # split that reads like an auth bug. MANTLE_CLIENT_ORIGIN names it too:
      # the brain forwards the /n/<id> links it builds to the client there.
      - name: Start the brain
        if: vars.E2E_SERVER_URL == ''
        run: |
          docker run -d --name e2e-brain --network host \
            -e DATABASE_URL='postgres://postgres:e2e@localhost:5432/postgres' \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e MANTLE_MASTER_KEY="$MANTLE_MASTER_KEY" \
            -e S3_ENDPOINT='http://localhost:9000' -e S3_REGION=us-east-1 \
            -e S3_BUCKET=mantle -e S3_ACCESS_KEY=e2e-access -e S3_SECRET_KEY=e2e-secret-key \
            -e S3_FORCE_PATH_STYLE=true -e NODE_ENV=production \
            -e PORT=3900 \
            -e MANTLE_PUBLIC_URL='http://localhost:3900' \
            -e MANTLE_API_CORS_ORIGINS='http://localhost:3901' \
            -e MANTLE_CLIENT_ORIGIN='http://localhost:3901' \
            -e BROWSER_WS_ENDPOINT='ws://localhost:3000?token=mantle' \
            -e MANTLE_PRINT_ORIGIN='http://localhost:3900' \
            -e MANTLE_SPACES_ROOT=/tmp/mantle-spaces \
            titanwest/mantle-server:${{ vars.E2E_SERVER_IMAGE_TAG || 'latest' }}
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3900/api/version && break
            sleep 2
          done
          curl -sf http://localhost:3900/api/version || { docker logs e2e-brain; exit 1; }

      # run-local.sh puts this checkout's owner UI on :3901 in front of the
      # brain and runs the split project — the same command a developer runs,
      # so CI and a local run cannot drift. The brain has no owner, so the suite
      # bootstraps one through the real signup + onboarding path.
      - name: e2e
        env:
          E2E_SERVER_URL: ${{ vars.E2E_SERVER_URL || 'http://localhost:3900' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # NOT skipped: the browser sidecar above is exactly what it needs.
          E2E_SKIP_PDF: ${{ vars.E2E_SKIP_PDF }}
        run: pnpm e2e

      # The brain's own log is the other half of a failure; the traces below are
      # only what the browser saw.
      - name: Brain log
        if: failure() && vars.E2E_SERVER_URL == ''
        run: |
          echo '── brain ──'; docker logs e2e-brain 2>&1 | tail -200
          echo '── browser sidecar ──'; docker logs e2e-browser 2>&1 | tail -40
          echo '── object store ──'; docker logs e2e-objectstore 2>&1 | tail -40

      # Traces are retained on failure (playwright.config), and they are the
      # only way to see what a headless run actually did. The owner UI's log is
      # outside the checkout on purpose (run-local.sh says why); TMPDIR is
      # unset on the runner, so it is under /tmp.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            e2e/test-results/
            /tmp/jackdaw-e2e-3901/client.log
          retention-days: 7
          if-no-files-found: ignore
