# The Bun lane: the developer tools on the Bun runtime, beside the Node gate
# (verify.yml), and the proof that both give the same result. Node stays the
# default and the required gate; this lane says where Bun differs.
# docs/bun-tooling.md has the why and the numbers.
#
# pnpm installs, as in every other workflow: Bun only RUNS the tools here.
# Bun's own installer does not keep pnpm-lock.yaml's versions (see the doc).
#
# It runs on main and on Bun branches, and by hand, not on every pull request:
# a red here is a fact about Bun, and it must not block ordinary work while
# Bun is the second runtime.

name: bun-lane

on:
  push:
    branches: [main, 'feat/*bun*']
  workflow_dispatch:

concurrency:
  group: bun-lane-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  bun:
    runs-on: ubuntu-24.04
    # verify and two static builds: about 2.5 minutes on the workstation.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # The pinned version with a pinned checksum (scripts/install-bun.sh), not
      # an install script and not a third-party action.
      - name: Install Bun
        run: |
          scripts/install-bun.sh "$RUNNER_TEMP/bun-bin"
          echo "$RUNNER_TEMP/bun-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # What bun.sh starts, and the `node` it puts on PATH, must be the pinned
      # Bun: the step fails otherwise, and so does the test, since bun.sh sets
      # MANTLE_EXPECT_RUNTIME. verify:bun runs the test again, in the suite.
      - name: The runtime under bun.sh
        run: |
          want="$(tr -d '[:space:]' < .bun-version)"
          have="$(scripts/bun.sh node -p 'process.versions.bun ?? "NOT BUN"')"
          echo "node under bun.sh: $have (.bun-version: $want)"
          test "$have" = "$want"
          scripts/bun.sh vitest run scripts/bun-runtime.test.ts

      # typecheck, lint, format:check and vitest, every one of them on Bun.
      - name: Verify on Bun
        run: pnpm verify:bun

      # The same export twice, once per runtime, from a clean .next each time.
      - name: Build on Node
        run: |
          pnpm -C client/web build
          pnpm -C client/host build
          mv client/web/out "$RUNNER_TEMP/out-node"
          cp client/host/dist/server.mjs "$RUNNER_TEMP/server-node.mjs"

      # The Bun build starts from nothing Node made: no .next, no export, no
      # host bundle, and none of what prebuild writes into public/
      # (copy-excalidraw-assets.mjs, build-boot.mjs). A Bun prebuild that did
      # nothing then shows up in the compare as missing files.
      - name: Clean the Node build
        run: |
          rm -rf client/web/.next client/web/out client/host/dist
          rm -rf client/web/public/_mantle client/web/public/excalidraw-assets

      - name: Build on Bun
        run: pnpm build:bun

      # The host bundle must be byte-equal. The export must be the same UI:
      # equal after the random build id, apart from the theme script pair
      # compare-export.mjs pins. --expect-reprint fails it when no page was
      # reprinted, which is what a "Bun" build that ran on Node gives. Both
      # compares run and are reported before the step fails, so one red does
      # not hide the other.
      - name: Compare the builds
        run: |
          failed=0
          if cmp "$RUNNER_TEMP/server-node.mjs" client/host/dist/server.mjs; then
            echo "server.mjs: byte-equal"
          else
            echo "::error::server.mjs differs between the Node and the Bun build"
            failed=1
          fi
          if pnpm compare:export "$RUNNER_TEMP/out-node" client/web/out --expect-reprint; then
            echo "export: the same UI, reprinted on Bun"
          else
            echo "::error::the Node and the Bun export are not the same UI"
            failed=1
          fi
          exit "$failed"

  # The workspace specs with the owner UI's `next dev` on Bun. Playwright
  # itself runs on Node, as in verify.yml.
  e2e-workspace-bun:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install Bun
        run: |
          scripts/install-bun.sh "$RUNNER_TEMP/bun-bin"
          echo "$RUNNER_TEMP/bun-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm -C e2e exec playwright install --with-deps chromium

      - name: e2e (workspace, mock API, next dev on Bun)
        run: pnpm e2e:workspace:bun

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-workspace-bun-traces
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
