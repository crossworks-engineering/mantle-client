# Desktop pipeline — fires on the same version tags as the image release.
# Builds the Jackdaw desktop app for Linux/macOS/Windows and uploads the installers to
# a DRAFT GitHub release (electron-builder's default on tag builds) —
# publishing the release stays a human act, exactly like deploys.
#
# ⚠ THE DRAFT IS CREATED ONCE, BY ITS OWN JOB, BEFORE ANY BUILDER RUNS.
# `electron-builder --publish always` creates a release when it cannot find one
# for the tag, and creating a draft is NOT idempotent by tag: GitHub will
# happily hold several drafts pointing at the same one. Three matrix jobs
# starting together therefore raced, and v0.6.78 came out as TWO drafts with the
# artifacts split across them — `latest-linux.yml` in one, `latest.yml` and
# `latest-mac.yml` in the other, and one mac blockmap in a different release
# from its own .zip. Publishing either would have shipped half the platforms
# with an updater manifest pointing at assets that are not there.
#
# This is also the likeliest explanation for the pile of 21 unpublished drafts
# found in September: a matrix that mints a fresh draft per run turns one
# forgotten publish into a growing heap. When checking a release, ask HOW MANY
# drafts carry the tag, not just whether one is published.
#
# macOS signing follows the secrets (names in client/desktop/README.md):
# with the Developer ID certificate and the App Store Connect API key the app
# is signed, notarized and stapled; without them it is AD-HOC signed, which
# macOS reports as an unverified developer (Open Anyway) rather than
# "damaged". A TAG build refuses to run without all five secrets, so a
# release is always Developer ID. electron-updater only self-updates that build.
# Linux and Windows auto-update from the published release.

name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Serialises the one non-idempotent step. Everything after this finds the
  # release already there and only uploads to it.
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Ensure exactly one draft release for this tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # `gh release view` finds drafts too, so a re-run of this workflow
          # reuses the existing one rather than adding another.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing it"
          else
            gh release create "$TAG" --draft --title "$TAG" \
              --notes "Desktop builds for $TAG. Publish deliberately once every platform's assets are attached."
            echo "created draft $TAG"
          fi

  build:
    # Not for the artifacts — for the ordering. The builders must not be the
    # thing that creates the release.
    needs: [draft]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # electron-builder uploads to the draft release
    steps:
      # Current majors, matching verify.yml. The v4/v3 line these pinned runs on
      # Node 20, which GitHub force-runs on 24 and annotates about on every job.
      #
      # NOT testable from a pull request: this workflow only does its real work
      # on a tag, so the evidence for these pins is verify.yml, which has run
      # them green on every push since v0.6.46. The docker/* actions beside
      # them in release.yml were left alone on purpose — a different vendor on
      # a different cadence, not what was flagged, and bundling them would give
      # a broken next release two candidate causes.
      - uses: actions/checkout@v7

      # No `version:`, matching verify.yml: the action reads packageManager
      # from package.json, which is where this repo already states its pnpm
      # version. Naming it here too was a second place to drift.
      - uses: pnpm/action-setup@v6

      # setup-node v7 narrowed AUTOMATIC cache detection to npm; `cache: pnpm`
      # is the explicit input and is unaffected.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build embedded owner UI (static export)
        shell: bash
        run: pnpm -C client/desktop build:ui

      # Mirrors the dist / dist:ci scripts, but calls electron-builder directly
      # so the macOS signing mode can add its own -c overrides.
      - name: Build and package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS only. Each is empty on the other runners and until the
          # secret exists. NOT named CSC_LINK here: electron-builder reads an
          # empty-but-set CSC_LINK as a path and fails ("not a file"), so the
          # script imports it into its own keychain (see below). It is a base64 .p12.
          MAC_CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          publish=never
          [[ "${{ github.ref_type }}" == "tag" ]] && publish=always
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # A RELEASE never ships a Mac app that is not Developer ID signed
            # and notarized. Branch and manual builds may still fall back to
            # ad-hoc below, with a warning.
            if [[ "$publish" == "always" ]]; then
              missing=()
              for v in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
                [[ -n "${!v}" ]] || missing+=("${v#MAC_}")
              done
              if (( ${#missing[@]} )); then
                echo "::error::Tag build refused: macOS signing/notarization secret(s) missing or empty: ${missing[*]}"
                exit 1
              fi
            fi
            if [[ -n "$MAC_CSC_LINK" ]]; then
              # The keychain is built HERE, not by electron-builder from
              # CSC_LINK: 26.15.3 passes the .p12 password to
              # set-key-partition-list as the KEYCHAIN password, which fails
              # with "SecKeychainUnlock: The user name or passphrase you
              # entered is not correct". electron-builder then finds the
              # Developer ID identity in the search list by itself.
              kc="$RUNNER_TEMP/signing.keychain-db"
              kcp=$(openssl rand -base64 32)
              echo "::add-mask::$kcp"
              security create-keychain -p "$kcp" "$kc"
              security set-keychain-settings -lut 21600 "$kc"
              security unlock-keychain -p "$kcp" "$kc"
              p12="$RUNNER_TEMP/cert.p12"
              printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$p12"
              security import "$p12" -k "$kc" -P "$MAC_CSC_KEY_PASSWORD" -f pkcs12 \
                -T /usr/bin/codesign -T /usr/bin/productbuild
              rm -f "$p12"
              # The intermediates, so the identity counts as valid even if the
              # runner image lacks them. Both generations; only one matches.
              for ca in DeveloperIDCA DeveloperIDG2CA; do
                curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
                security import "$RUNNER_TEMP/$ca.cer" -k "$kc" || true
              done
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcp" "$kc" >/dev/null
              security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
              security find-identity -v -p codesigning "$kc" | tail -1
              if ! security find-identity -v -p codesigning "$kc" | grep -q 'Developer ID Application'; then
                echo "::error::No valid Developer ID Application identity after importing CSC_LINK"
                exit 1
              fi
              export CSC_IDENTITY_AUTO_DISCOVERY=true
              if [[ -n "$APPLE_API_KEY_P8" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
                # @electron/notarize wants a path to the .p8, not its contents.
                key="$RUNNER_TEMP/AuthKey.p8"
                printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
                chmod 600 "$key"
                export APPLE_API_KEY="$key"
                echo "macOS: Developer ID signing + notarization"
              else
                echo "::warning::macOS is signed but NOT notarized (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER missing). Gatekeeper will still warn."
              fi
            else
              # No certificate: ad-hoc. The hardened runtime would reject the
              # Electron frameworks (no Team ID), so it goes off with notarizing.
              args=(-c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false)
              echo "::warning::macOS build is AD-HOC signed (no CSC_LINK secret). Users see Open Anyway, and self-update is off."
            fi
          fi
          unset APPLE_API_KEY_P8 MAC_CSC_LINK MAC_CSC_KEY_PASSWORD
          pnpm -C client/desktop build
          pnpm -C client/desktop exec electron-builder --publish "$publish" "${args[@]}"

      # The check that would have caught the "damaged" builds: a broken seal
      # fails here instead of on a user's Mac. On a tag the assets are already
      # on the DRAFT release by now, so a red job means: do not publish it.
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for app in client/desktop/dist/mac*/Jackdaw.app; do
            echo "== $app"
            codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Signature|Runtime|Sealed)' || true
            codesign --verify --deep --strict --verbose=2 "$app"
            if codesign -dv "$app" 2>&1 | grep -q '^Signature=adhoc'; then
              echo "ad-hoc build: Gatekeeper will ask for Open Anyway (expected until the Developer ID secrets exist)"
            else
              spctl -a -vv -t exec "$app"
              xcrun stapler validate "$app"
            fi
          done

      - name: Upload artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: jackdaw-desktop-${{ matrix.os }}
          path: |
            client/desktop/dist/*.AppImage
            client/desktop/dist/*.deb
            client/desktop/dist/*.dmg
            client/desktop/dist/*.zip
            client/desktop/dist/*.exe
          if-no-files-found: warn
