packages:
  - "client/*"
  - "packages/*"
  - "e2e"

# pnpm 11 requires explicit approval for packages with build scripts (see the
# mantle repo's pnpm-workspace.yaml for the full rationale).
allowBuilds:
  electron: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  electron-winstaller: true
  '@parcel/watcher': false

# Overrides and patches live HERE, not in package.json#pnpm: pnpm 11 reads its
# settings from this file and silently ignores that field (the lockfile carried
# no overrides at all, and the katex patch had been unapplied since katex moved
# past 0.18.1). Found in the 2026-09-07 frontend audit.
#
# The @mantle/* aliases mirror what each package.json declares directly.
# nanoid / lodash-es / mermaid ride in under @excalidraw/excalidraw 0.18.1 (the
# latest release) with known advisories; fast-uri / @xmldom/xmldom under
# electron-builder (build-time only).
overrides:
  "@mantle/client-types": "npm:@crossworks/client-types@0.400.0"
  "@mantle/content-core": "npm:@crossworks/content-core@0.400.0"
  "@mantle/voice-client": "npm:@crossworks/voice-client@0.239.4"
  "@mantle/share-ui": "npm:@crossworks/share-ui@0.400.0"
  # Mermaid is not supported (stubs/mermaid-to-excalidraw/README.md). Excalidraw
  # reaches its Mermaid feature through a dynamic import(), so the UI prop alone
  # would leave the real package installed and its ~640 KB chunk emitted; this
  # points it at a local stub instead. That subtree was also the only source of
  # mermaid, lodash-es and nanoid@4, so those three overrides came out with it.
  "@excalidraw/mermaid-to-excalidraw": "link:./stubs/mermaid-to-excalidraw"
  "fast-uri": "3.1.8"
  "@xmldom/xmldom": "0.8.15"
  "nanoid@3": "3.3.18"
  # Audit floor for transitive pins the parents have not moved yet (2026-10-08):
  # http-cache-semantics under electron-builder's @electron/get (build-time),
  # source-map-js under vite's postcss (dev-time), and
  # postcss-selector-parser under @tailwindcss/typography 0.5.20 (pinned 6.0.10;
  # 7.x only made insertions during iteration safe, and the plugin's CSS output
  # was diffed byte-identical across the swap).
  "http-cache-semantics": "4.3.0"
  "source-map-js": "1.2.2"
  "@tailwindcss/typography>postcss-selector-parser": "7.1.6"

# The excalidraw patch drops upstream's esm.sh font source once
# EXCALIDRAW_ASSET_PATH is set (client/web/components/draw/excalidraw-canvas.tsx).
# Upstream lists it after the self-hosted source for every font face, and
# Chromium CSP-checks every FontFace source up front, so our font-src logged a
# violation per face (~230 a session) although the self-hosted copy loaded.
# The change is one condition in each build; the patch is ~440 KB only because
# the prod chunk is a single minified line. Re-check it on every package bump:
# pnpm refuses an unused patch, and e2e/specs/draw-fonts.spec.ts fails without it.
patchedDependencies:
  '@excalidraw/excalidraw@0.18.1': patches/@excalidraw__excalidraw@0.18.1.patch
  katex@0.18.11: patches/katex@0.18.11.patch
