packages:
  - "client/*"
  - "packages/*"
  - "e2e"

# pnpm 11 requires explicit approval for packages with build scripts (see the
# mantle repo's pnpm-workspace.yaml for the full rationale).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@parcel/watcher': false

# pnpm holds every package back until it is a day old (1440 minutes, its
# default, stated here so it shows), and since pnpm 11.3 it checks that again
# against every lockfile entry on a frozen install.
#
# The contract packages are ours: a client release takes the version our own
# release workflow published that day, so without the exclusion the install
# fails for up to 24 hours in verify.yml, bun-lane.yml and the Dockerfile
# (release.yml). The risk is small: each contract package is pinned to one
# exact version (the overrides below and the manifests) in a reviewed commit,
# the lockfile holds its integrity, and npm never lets a published version be
# replaced. The scope is exactly our org; every other package keeps the wait.
# The owner's decision, 2026-11-25.
#
# Strict: a version under the age makes a resolve fail (at a terminal pnpm
# asks), instead of pnpm writing its own entry into the exclude list and going
# on. It is pnpm's default once minimumReleaseAge is set; stated so it shows.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@crossworks/*'
minimumReleaseAgeStrict: true

# Overrides and patches live HERE, not in package.json#pnpm: pnpm 11 reads its
# settings from this file and silently ignores that field (the lockfile carried
# no overrides at all, and the katex patch had been unapplied since katex moved
# past 0.18.1). Found in the 2026-09-07 frontend audit.
#
# The @mantle/* aliases mirror what each package.json declares directly.
# nanoid / lodash-es / mermaid ride in under @excalidraw/excalidraw 0.18.1 (the
# latest release) with known advisories. The fast-uri, @xmldom/xmldom and
# http-cache-semantics floors went with the Electron shell (2026-11-25): only
# electron-builder and @electron/get brought them in.
overrides:
  "@mantle/client-types": "npm:@crossworks/client-types@0.712.21"
  "@mantle/content-core": "npm:@crossworks/content-core@0.712.21"
  "@mantle/voice-client": "npm:@crossworks/voice-client@0.712.21"
  "@mantle/share-ui": "npm:@crossworks/share-ui@0.712.21"
  # Mermaid is not supported (stubs/mermaid-to-excalidraw/README.md). Excalidraw
  # reaches its Mermaid feature through a dynamic import(), so the UI prop alone
  # would leave the real package installed and its ~640 KB chunk emitted; this
  # points it at a local stub instead. That subtree was also the only source of
  # mermaid, lodash-es and nanoid@4, so those three overrides came out with it.
  "@excalidraw/mermaid-to-excalidraw": "link:./stubs/mermaid-to-excalidraw"
  "nanoid@3": "3.3.18"
  # Audit floor for transitive pins the parents have not moved yet (2026-10-08):
  # source-map-js under vite's postcss (dev-time), and
  # postcss-selector-parser under @tailwindcss/typography 0.5.20 (pinned 6.0.10;
  # 7.x only made insertions during iteration safe, and the plugin's CSS output
  # was diffed byte-identical across the swap).
  "source-map-js": "1.2.2"
  "@tailwindcss/typography>postcss-selector-parser": "7.1.6"
  # zod rides in under eslint-plugin-react-hooks (lint-time only). Below 4.6.6
  # it has a memory exhaustion bug. pnpm applies this to every dependent whose
  # range intersects <4.6.6 (the plugin's is ^3.25.0 || ^4.0.0), so the value
  # is a range, not a pin: later 4.x fixes still resolve (2026-10-30).
  "zod@<4.6.6": "^4.6.6"
  # vitest is held at 5.0.5 (with it @vitest/mocker and @vitest/spy, which it
  # pins exactly) for the Bun lane. 5.1.1 added a watchdog to the forks pool
  # that calls child.channel?.unref(), and Bun's subprocess channel has no
  # unref (oven-sh/bun#33593, open; vitest-dev/vitest#12037 was closed as a Bun
  # bug), so verify:bun starts no test at all. 5.1.x fixes no advisory that
  # 5.0.5 has (vitest's own list, 2026-11-25). Lift it when Bun gives the
  # channel unref, or vitest guards the call; check with pnpm verify:bun.
  # .github/dependabot.yml ignores vitest for the same reason.
  "vitest": "5.0.5"

# The excalidraw patch drops upstream's esm.sh font source once
# EXCALIDRAW_ASSET_PATH is set (client/web/components/draw/excalidraw-canvas.tsx).
# Upstream lists it after the self-hosted source for every font face, and
# Chromium CSP-checks every FontFace source up front, so our font-src logged a
# violation per face (~230 a session) although the self-hosted copy loaded.
# The change is one condition in each build; the patch is ~440 KB only because
# the prod chunk is a single minified line. Re-check it on every package bump:
# pnpm refuses an unused patch, and e2e/specs/draw-fonts.spec.ts fails without it.
patchedDependencies:
  '@excalidraw/excalidraw@0.18.1': patches/@excalidraw__excalidraw@0.18.1.patch
  katex@0.19.1: patches/katex@0.19.1.patch
